name: deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: 构建发布包
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:api
      # 静态端只发布到腾讯云服务器，H5 与 API 同域：默认 API 前缀 /mixmapp/api/v1。
      # 需要换域名时用仓库变量 MIXMAPP_API_BASE 覆盖，不必改代码。
      - name: 构建 H5（同域 + /mixmapp 前缀）
        env:
          MIXMAPP_API_BASE: ${{ vars.MIXMAPP_API_BASE || '/mixmapp/api/v1' }}
        run: pnpm build:h5

      - name: 生成独立可运行 API 发布包
        run: pnpm --filter @mixmapp/api deploy --prod "$GITHUB_WORKSPACE/out/api"

      - name: 打包 API 产物
        run: |
          mkdir -p release
          cp -a out/api/. release/
          cp -a infra release/infra
          cp -a scripts release/scripts
          tar -czf api-${{ github.sha }}.tar.gz -C release .

      - name: 打包 H5 产物
        run: tar -czf h5-${{ github.sha }}.tar.gz -C apps/app/dist/build/h5 .

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          retention-days: 14
          path: |
            api-${{ github.sha }}.tar.gz
            h5-${{ github.sha }}.tar.gz

  api:
    name: API + H5 原子发布（腾讯云服务器）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SSH_READY: ${{ secrets.DEPLOY_SSH_KEY_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundles

      - name: 写入部署私钥（base64 单行传输，避免换行符破坏 OpenSSH 私钥）
        if: env.SSH_READY == 'true'
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 上传发布包与脚本
        if: env.SSH_READY == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'rm -rf /tmp/mixmapp-deploy'
          scp -i ~/.ssh/deploy_key api-${{ github.sha }}.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/api.tar.gz"
          scp -i ~/.ssh/deploy_key h5-${{ github.sha }}.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/web.tar.gz"
          scp -i ~/.ssh/deploy_key -r deploy \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/mixmapp-deploy"

      - name: 远端原子发布
        if: env.SSH_READY == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo mkdir -p /opt/mixmapp/deploy && sudo cp -r /tmp/mixmapp-deploy/* /opt/mixmapp/deploy/ && \
             sudo ARTIFACT=/tmp/api.tar.gz WEB_ARTIFACT=/tmp/web.tar.gz bash /opt/mixmapp/deploy/atomic-release.sh'

      - name: 线上健康校验
        if: env.SSH_READY == 'true' && vars.HEALTH_BASE_URL != ''
        run: node scripts/healthcheck.mjs ${{ vars.HEALTH_BASE_URL }}

      - name: 无 SSH 凭据时跳过
        if: env.SSH_READY != 'true'
        run: echo "SKIP 未配置 DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_USER，API 未发布"
