name: deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: 构建发布包
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:api
      - run: pnpm build:h5

      - name: 生成独立可运行 API 发布包
        run: pnpm --filter @mixmapp/api deploy --prod out/api

      - name: 打包 API 产物
        run: |
          mkdir -p release
          cp -a out/api/. release/
          cp -a infra release/infra
          cp -a scripts release/scripts
          tar -czf api-${{ github.sha }}.tar.gz -C release .

      - name: 打包 H5 产物
        run: tar -czf h5-${{ github.sha }}.tar.gz -C apps/app/dist/build/h5 .

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          retention-days: 14
          path: |
            api-${{ github.sha }}.tar.gz
            h5-${{ github.sha }}.tar.gz

  static:
    name: 静态端发布（Cloudflare Pages）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundles

      - name: 解包 H5
        run: mkdir -p apps/app/dist/build/h5 && tar -xzf h5-${{ github.sha }}.tar.gz -C apps/app/dist/build/h5

      - name: 发布到 Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'mixmapp' }}
        run: node scripts/deploy-static.mjs

      - name: 无凭据时跳过
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "SKIP 未配置 Cloudflare 凭据，静态端产物仅保留在 workflow artifact"

  api:
    name: API 原子发布（SSH）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundles

      - name: 写入部署私钥
        if: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 上传发布包与脚本
        if: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          scp -i ~/.ssh/deploy_key api-${{ github.sha }}.tar.gz \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/api.tar.gz"
          scp -i ~/.ssh/deploy_key -r deploy \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/mixmapp-deploy"

      - name: 远端原子发布
        if: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'sudo mkdir -p /opt/mixmapp/deploy && sudo cp -r /tmp/mixmapp-deploy/* /opt/mixmapp/deploy/ && \
             sudo ARTIFACT=/tmp/api.tar.gz bash /opt/mixmapp/deploy/atomic-release.sh'

      - name: 线上健康校验
        if: ${{ secrets.DEPLOY_SSH_KEY != '' && vars.HEALTH_BASE_URL != '' }}
        run: node scripts/healthcheck.mjs ${{ vars.HEALTH_BASE_URL }}

      - name: 无 SSH 凭据时跳过
        if: ${{ secrets.DEPLOY_SSH_KEY == '' }}
        run: echo "SKIP 未配置 DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_USER，API 未发布"
