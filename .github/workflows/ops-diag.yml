name: ops-diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 诊断
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'EOS'
          set +e
          echo "== api local =="
          curl -s -o /dev/null -w 'meta=%{http_code}\n' http://127.0.0.1:8080/api/v1/meta
          echo "== gateway env =="
          sudo grep -E '^(CLOUDBASE_PG_GATEWAY|CLOUDBASE_PG_API_KEY|CLOUDBASE_PG_SCHEMA)=' /etc/mixmapp/api.env
          echo "== vhost via loopback SNI =="
          curl -sk --resolve cloud.mix.top:443:127.0.0.1 https://cloud.mix.top/mixmapp/api/v1/meta | head -c 160
          echo
          echo "== sites-enabled =="
          sudo ls -l /etc/nginx/sites-enabled/
          echo "== listening 443 =="
          sudo ss -tlnp | grep ':443' | head -5
          EOS
