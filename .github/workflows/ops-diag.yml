name: ops-diag
on:
  workflow_dispatch:
    inputs:
      script:
        description: base64 script
        required: true
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: run
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          echo "$KEY" | base64 -d > /tmp/k && chmod 600 /tmp/k
          echo "${{ inputs.script }}" > /tmp/s.b64
          base64 -d /tmp/s.b64 > /tmp/s.sh || true
          ssh -o StrictHostKeyChecking=no -i /tmp/k "$USER@$HOST" 'bash -s' < /tmp/s.sh