name: ops-tunnel

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 建立临时隧道
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > /tmp/remote.sh <<'EOS'
          ARCH=$(uname -m); case "$ARCH" in x86_64) A=amd64;; aarch64) A=arm64;; *) A=amd64;; esac
          if [ ! -x /usr/local/bin/cloudflared ]; then
            sudo curl --http1.1 -fsSL -o /usr/local/bin/cloudflared "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-$A" || exit 1
            sudo chmod +x /usr/local/bin/cloudflared
          fi
          /usr/local/bin/cloudflared --version
          pkill -f 'cloudflared tunnel' >/dev/null 2>&1 || true
          sleep 1
          sudo rm -f /tmp/cf.log
          sudo systemctl reset-failed mixmapp-cf >/dev/null 2>&1 || true
          sudo systemd-run --unit=mixmapp-cf --collect /usr/local/bin/cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate --logfile /tmp/cf.log --loglevel info
          for i in $(seq 1 25); do
            grep -q 'trycloudflare.com' /tmp/cf.log 2>/dev/null && break
            sleep 1
          done
          URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
          echo "TUNNEL_URL=$URL"
          curl -sS -o /dev/null -w 'local_meta=%{http_code}\n' -m 10 http://127.0.0.1:8080/api/v1/meta
          [ -n "$URL" ] && curl -sS -o /dev/null -w 'tunnel_meta=%{http_code}\n' -m 20 "$URL/api/v1/meta"
          exit 0
          EOS
          timeout 150 ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < /tmp/remote.sh
