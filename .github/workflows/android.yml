name: Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/app/**'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'version.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/app/**'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'version.json'
  workflow_dispatch:
    inputs:
      release:
        description: '同时构建 release AAB（需要签名 Secrets）'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 版本号唯一事实源：version.json。app/build.gradle 会从它动态读 version / channel / counters
      # 生成 versionCode / versionName；这里再解析一次用于日志与产物命名，规则保持一致：
      # 三段式基线 0.0.0；release 取 version，preview/dev 追加 -<channel>，计数 > 0 再加 .N。
      # versionCode = 1 + major*10000 + minor*100 + patch（0.0.0 → 1）。
      - name: 读取版本（version.json 单一事实源）
        id: version
        run: |
          node -e 'const v=require("./version.json");const fs=require("fs");const ch=v.channel||"release";const n=Number((v.counters||{})[ch]||0);const vn=ch==="release"?String(v.version):`${v.version}-${ch}${n>0?"."+n:""}`;const p=String(v.version).split(".").map(Number);const vc=1+p[0]*10000+p[1]*100+p[2];fs.appendFileSync(process.env.GITHUB_OUTPUT,"version_name="+vn+"\nversion_code="+vc+"\n");console.log("versionName="+vn+"  versionCode="+vc);'

      - name: Build H5（注入壳内 API 源）
        # 壳的 WebView 从 https://localhost 加载本地资源，必须把 API 绝对地址写进 HTML，
        # 否则所有请求落到 https://localhost/api/v1（全站离线）。可用仓库变量覆盖。
        # 2026-11-14 起客户端基址定为 api.mixm.top；正式包必须在 api.mixm.top 双跑
        # 验证（healthz/meta 正常）之后再出，否则新壳指向未生效域名。
        env:
          MIXMAPP_API_BASE: ${{ vars.MIXMAPP_API_BASE || 'https://api.mixm.top/mixmapp/api/v1' }}
        run: node scripts/build-h5.mjs

      - name: Sync Capacitor（含 API 源注入）
        # 注入放在 sync 之后由脚本兜住：任何人裸跑 build:h5 + cap sync 都不会把注入覆盖掉
        run: pnpm --filter @mixmapp/mobile sync:android

      - name: Check shell assets（完整体检）
        # --check 输出 API 源 / HTTPS / /api/v1 后缀 / viewport-fit=cover / JS 产物等清单
        run: node scripts/android-inject-base.mjs --check

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        # Windows 提交的 gradlew 会丢可执行位，这里显式补回，避免 Permission denied(126)
        run: chmod +x apps/mobile/android/gradlew

      - name: Assemble debug APK
        # 统一走 scripts/android-build.mjs（自动挑 JDK 21），与本地 build:debug 同一入口；
        # android-build.mjs 内部把 cwd 切到 apps/mobile/android，故这里无需 working-directory。
        run: node scripts/android-build.mjs assembleDebug --no-daemon

      - name: Decode keystore
        if: env.HAS_SIGNING == 'true'
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "keystore written: $(stat -c%s release.keystore) bytes"

      - name: Assemble release AAB
        if: env.HAS_SIGNING == 'true'
        # 签名四项全部来自 Secrets；app/build.gradle 的 signingConfigs.release 读取同名
        # 环境变量（本地则回退到 .secrets/keystore.properties + release.keystore）。
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/mobile/android/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android-build.mjs bundleRelease --no-daemon

      - name: Warn when unsigned
        if: env.HAS_SIGNING != 'true'
        run: echo "::warning::未配置签名 Secrets，本次只产出 debug APK，release AAB 未构建（不得视为可发布产物）"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mixmapp-debug-apk-${{ steps.version.outputs.version_name }}
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload AAB
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mixmapp-release-aab-${{ steps.version.outputs.version_name }}
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
