name: Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/app/**'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/app/**'
      - 'apps/mobile/**'
      - 'packages/**'
  workflow_dispatch:
    inputs:
      release:
        description: '同时构建 release AAB（需要签名 Secrets）'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build H5
        run: pnpm --filter @mixmapp/app build:h5

      - name: Sync Capacitor
        run: pnpm --filter @mixmapp/mobile exec cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Decode keystore
        if: env.HAS_SIGNING == 'true'
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "keystore written: $(stat -c%s release.keystore) bytes"

      - name: Assemble release AAB
        if: env.HAS_SIGNING == 'true'
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/mobile/android/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Warn when unsigned
        if: env.HAS_SIGNING != 'true'
        run: echo "::warning::未配置签名 Secrets，本次只产出 debug APK，release AAB 未构建（不得视为可发布产物）"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mixmapp-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload AAB
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mixmapp-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
