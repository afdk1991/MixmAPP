name: Pages

# GitHub Pages 直接挂在 MixmAPP 主仓库上（项目名 = MixmAPP），发布单文件 H5 产物
on:
  push:
    branches: [main]
    paths:
      - 'apps/app/**'
      - 'packages/**'
      - 'scripts/build-h5-single.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 打单文件 H5（路由 base 对齐子路径 /MixmAPP/）
        env:
          MIXMAPP_H5_BASE: /MixmAPP/
          # Pages 是跨域静态托管，单文件产物必须内置绝对 API 地址。
          # 这里用独立变量 PAGES_API_BASE，不复用主站同源的 MIXMAPP_API_BASE
          # （其值为相对路径 /mixmapp/api/v1，仅供 cloud.mixm.top 同源部署，保住 CORS 收益）。
          MIXMAPP_API_BASE: ${{ vars.PAGES_API_BASE || 'https://cloud.mixm.top/mixmapp/api/v1' }}
        run: node scripts/build-h5-single.mjs

      - name: 组装站点目录
        run: |
          mkdir -p _site
          cp release/mixmapp-h5-single.html _site/index.html
          # 路由是 history 模式（/MixmAPP/pages/auth/register），Pages 没有该路径的文件时
          # 会用 404.html 兜底，所以把同一份单文件再放一份，深链接才不会断
          cp release/mixmapp-h5-single.html _site/404.html
          touch _site/.nojekyll
          ls -l _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 写地址到 Job Summary
        run: echo "线上地址：${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
