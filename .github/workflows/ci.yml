name: ci

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: 门禁（规则/类型/单元测试/真实库集成/构建/健康检查）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mixmapp
          POSTGRES_PASSWORD: mixmapp
          POSTGRES_DB: mixmapp_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mixmapp -d mixmapp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://mixmapp:mixmapp@127.0.0.1:5432/mixmapp_ci
      REQUIRE_DATABASE_URL: '1'
      RUN_MIGRATIONS: '1'
      JWT_SECRET: ci-secret-ci-secret-ci-secret-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 版本一致性（version.json ↔ 各包 ↔ README）
        run: pnpm version:check

      - name: 规则检查
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 数据库迁移
        run: pnpm db:migrate

      - name: 单元测试
        run: pnpm test

      - name: 真实 PostgreSQL 集成测试
        run: pnpm --filter @mixmapp/api test -- test/postgres.integration.test.ts

      - name: 构建 API
        run: pnpm build:api

      - name: 构建 H5
        run: pnpm build:h5

      - name: 启动 API 并做健康检查
        run: |
          node services/api/dist/index.js &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/v1/readyz | grep -q '"ready":true'; then
              echo "readyz ok (attempt $i)"
              break
            fi
            sleep 2
            if [ "$i" = "20" ]; then echo "API 未在 40s 内就绪"; exit 1; fi
          done
          curl -fsS http://127.0.0.1:8080/api/v1/healthz
          curl -fsS http://127.0.0.1:8080/api/v1/meta

      - name: 构建微信小程序
        run: pnpm build:mp-weixin

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mixmapp-artifacts
          if-no-files-found: error
          retention-days: 7
          path: |
            services/api/dist
            apps/app/dist/build/h5
            apps/app/dist/build/mp-weixin
