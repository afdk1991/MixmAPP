name: Image

# GitHub Packages（ghcr.io）发布：每次推 main 出一份 sha 镜像 + latest，并用真实容器做启动冒烟
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mixmapp
  DATABASE_URL: postgres://mixmapp:mixmapp@127.0.0.1:5432/mixmapp_img

jobs:
  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mixmapp
          POSTGRES_PASSWORD: mixmapp
          POSTGRES_DB: mixmapp_img
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mixmapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login ghcr（用内置 GITHUB_TOKEN，不需要额外凭据）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 迁移 + 容器启动冒烟（真起容器，不只看构建日志）
        env:
          JWT_SECRET: image-smoke-secret-should-be-long-enough-32
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            "$IMAGE:$GITHUB_SHA" node dist/db/migrate.js

          docker run -d --network host --name api \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e PUBLIC_BASE_URL=http://127.0.0.1:8080 \
            "$IMAGE:$GITHUB_SHA"

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/v1/readyz | grep -q '"ready":true'; then
              echo "readyz ok (attempt $i)"; break
            fi
            sleep 2
            [ "$i" = "20" ] && { echo "::error::容器未就绪"; docker logs api; exit 1; }
          done

          curl -fsS http://127.0.0.1:8080/api/v1/meta | head -c 200; echo
          docker logs api | tail -5

      - name: 写镜像摘要到 Job Summary
        run: |
          echo "镜像：\`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "拉取：\`docker pull $IMAGE:latest\`" >> "$GITHUB_STEP_SUMMARY"


