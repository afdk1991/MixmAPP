<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f9d8f" />
    <meta name="description" content="MixmAPP — 一个账号跑通所有端" />
    <title>MixmAPP</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/static/favicon.png" />
    <link rel="apple-touch-icon" href="/static/logo-192.png" />
    <script>
      /* 首屏防闪白：在 CSS/JS 生效前同步读取主题偏好并打标（key 与 src/theme.ts 一致）。
       * light / dark 写 data-mx-theme；auto 不写属性，交给 prefers-color-scheme 跟随系统。 */
      (function () {
        try {
          var pref = localStorage.getItem('mixmapp:theme');
          if (pref === 'light' || pref === 'dark') {
            document.documentElement.setAttribute('data-mx-theme', pref);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
