# ============================================================================
# mixm.top —— 裸域统一 301 到 www（2026-11-14 定案）
# ----------------------------------------------------------------------------
# 只做跳转，不承载页面、不反代 API。单跳，不做多级跳转。
# 生效前置：DNSPod 裸域（@）A 记录 → 本机 → 证书；443 段由 certbot 追加后
#   把同样的 return 301 放进 443 server 块。
# 回滚：禁用本文件并 reload；裸域届时无响应，但 www / cloud 不受影响。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name mixm.top;

    return 301 https://www.mixm.top$request_uri;
}
