# ============================================================================
# mixm.top —— 裸域统一 301 到 www（2026-11-14 定案，2026-11-15 落地 443）
# ----------------------------------------------------------------------------
# 只做跳转，不承载页面、不反代 API。单跳，不做多级跳转。
# 证书：/etc/letsencrypt/live/mixmapp-domains/（SAN: mixm.top/www/api/img，certbot 自动续期）
# 回滚：禁用本文件并 reload；裸域届时无响应，但 www / cloud 不受影响。
#
# 80 段用 location 级跳转而不是 server 级 return：certbot 的 nginx 插件在做
# http-01 验证时会在 server 块里插入 exact-match 的 acme-challenge location，
# server 级 return 会先于 location 匹配执行，导致续期失败。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name mixm.top;

    location / {
        return 301 https://www.mixm.top$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mixm.top;

    ssl_certificate     /etc/letsencrypt/live/mixmapp-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mixmapp-domains/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    location / {
        return 301 https://www.mixm.top$request_uri;
    }
}
