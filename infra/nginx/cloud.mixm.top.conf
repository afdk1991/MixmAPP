# ============================================================================
# 【LEGACY 双跑】cloud.mixm.top —— 2026-11-14 起不再是主入口，也不再是 API 宿主
# ----------------------------------------------------------------------------
# 新架构：主入口 www.mixm.top（infra/nginx/www.mixm.top.conf）
#         API     api.mixm.top（infra/nginx/api.mixm.top.conf）
#         图片    img.mixm.top（infra/nginx/img.mixm.top.conf）
#
# 本文件必须保留到以下条件全部满足：
#   1. www / api 的 /mixmapp/api/v1/healthz 与 /meta 均正常；
#   2. apps/mobile/api-base.json 已切到 api.mixm.top 并重新出包；
#   3. 微信 / 支付宝回调已改到 api.mixm.top 并完成验签与对账；
#   4. Nginx access.log 中 Host=cloud.mixm.top 的请求归零并持续一个观察周期。
# 满足前删本文件 = 已发布 APK 与存量订单回调直接断。
# 下线操作见 2026-11-14/deploy-domains/outputs/切换与回退序列.md §6。
# ----------------------------------------------------------------------------
# 原用途：修复 GET https://cloud.mixm.top/media/products/<sha1>.jpg → 404。
#   生产实测拓扑（docs/07 §17、§18、docs/08）：
#     /                  → SPA 静态 root /opt/mixmapp/current/web
#     /mixmapp/api/v1/*  → 反代 127.0.0.1:8080，剥掉 /mixmapp 前缀
#     /api/v1/*          → 反代 127.0.0.1:8080，原样（探活/外部调用走这条）
#     /media/*           → 本地磁盘 alias /var/lib/mixmapp/storage/
#
# ⚠ 应用方式：生产证书/TLS（443、certbot）已在既有
#   /etc/nginx/conf.d/cloud.mixm.top.conf 里，**不要整文件覆盖**，只把下面
#   4 个 location 段合并进现有 server{} 块；80 端口的跳转沿用现有配置。
#   改完执行：sudo nginx -t && sudo systemctl reload nginx
#
# ⚠ 前置条件（否则 /media 仍会 403/404，docs/07 §18 已踩过）：
#   1. 图片已同步到 /var/lib/mixmapp/storage/products/（本轮 872 张）。
#   2. nginx worker（www-data）能穿越目录：
#        sudo chgrp www-data /var/lib/mixmapp /var/lib/mixmapp/storage
#        sudo chmod o+rx /var/lib/mixmapp /var/lib/mixmapp/storage
#        sudo chmod -R o+rX /var/lib/mixmapp/storage/products
#   3. systemd mixmapp-api.service 的 ReadWritePaths 需含 /var/lib/mixmapp
#      （仓库 infra/systemd/mixmapp-api.service 第 23 行目前只有
#       /opt/mixmapp /var/log/mixmapp，ProtectSystem=strict 会禁写；
#       若导入经 API 进程写图片必须补，改完 daemon-reload + restart）。
#   4. API env：STORAGE_PROVIDER=local、STORAGE_DIR=/var/lib/mixmapp/storage。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    # 唯一生产入口（A → 115.159.159.11）。域名注册表见 deploy/domains.json，
    # 改动后跑 `pnpm domains:check`；同根域 mim/data/gy 属其他项目，不要加进本 vhost。
    server_name cloud.mixm.top;
    # 生产请把 80 端口 301 到 443，证书由 certbot 管理（沿用现有配置）：
    # return 301 https://$host$request_uri;

    client_max_body_size 25m;      # 与上传通道（app.ts bodyLimit 25MB）对齐
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;

    # ── 1. API 反代（不带 /mixmapp 前缀，探活与外部调用走这条）─────────────
    # proxy_pass 末尾不带 /：/api/v1/healthz 原样转发到上游 /api/v1/healthz。
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;     # 目录导入可能较慢，避免 60s 截断
    }

    # ── 2. 前端同域 API 前缀（window.__MIXMAPP_API_BASE__=/mixmapp/api/v1）──
    # proxy_pass 末尾带 /：剥掉 /mixmapp/ 前缀后转发。
    #   /mixmapp/api/v1/healthz → 上游 /api/v1/healthz
    # 这两条 location 都比 location / 长，前缀最长匹配优先，不会被 SPA try_files 抢走。
    location /mixmapp/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # ── 3. 本地存储图片直出（核心修复）────────────────────────────────────
    # publicUrl(key) = /media/<key>（storage.ts:163），key = products/<sha1>.jpg。
    # 用 alias 而非 root：URL 前缀 /media/ 不能出现在磁盘路径里。
    #   alias /var/lib/mixmapp/storage/ → /media/products/x.jpg = .../storage/products/x.jpg ✓
    #   root  /var/lib/mixmapp/storage  → 实际找 .../storage/media/products/x.jpg        ✗
    # try_files 必须带 =404：docs/07 §18 实测 alias + try_files $uri（带 URI 回退）
    # 会拼错路径 404；=404 硬兜底不触发内部重定向，安全。
    location /media/ {
        alias /var/lib/mixmapp/storage/;
        try_files $uri =404;
        access_log off;
        expires 30d;                 # 生成 Cache-Control: max-age=2592000
        # 如需 immutable，用下行并删掉 expires（同一响应头二选一，勿同时写）：
        # add_header Cache-Control "public, max-age=2592000, immutable" always;
        # location 内出现 add_header 后 server 级安全头不再继承，这里补齐：
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # 同域无需 CORS；仅当前端独立域托管时放开：
        # add_header Access-Control-Allow-Origin "*" always;
    }

    # ── 4. H5 SPA（history 深链接回退）───────────────────────────────────
    # atomic-release.sh 把 H5 解到 releases/<STAMP>/web，current/web 为软链；
    # 若生产 web 指向 /var/www/mixmapp-site，按实际落点调整 root。
    location / {
        root /opt/mixmapp/current/web;
        try_files $uri $uri/ /index.html;
    }
}

# ----------------------------------------------------------------------------
# 「不依赖 nginx」的兜底（只读核对结论，无需改 services/api/**）：
#   services/api/src/app.ts:168-170 在 storage.provider==='local' 时注册 mediaRoutes，
#   且该注册 **无 prefix**（主路由在 app.ts:182 才带 { prefix:'/api/v1' }），
#   因此后端路由是根路径 /media/*；media.ts 从 resolve(STORAGE_DIR) 读文件并做
#   isSafeStorageKey + 目录穿越校验。
#   若把上面 location /media/ 整段删掉，/media/* 会被 location /api/ 或 location /
#   反代/回退之外——此时只要 storage=local、图片在 STORAGE_DIR/products/，
#   API 自身即可直出（性能略低，但功能可用）。所需 env：
#     STORAGE_PROVIDER=local（默认值，config.ts:270）
#     STORAGE_DIR=/var/lib/mixmapp/storage（config.ts:279 production 默认值）
#     STORAGE_API_BASE=/mixmapp/api/v1（config.ts:280，仅影响上传预签名 URL，不影响读图）
# ----------------------------------------------------------------------------
