# ============================================================================
# cloud.mixm.top —— 兼容入口（2026-11-15 恢复）
# ----------------------------------------------------------------------------
# 历史：2026-11-14 主入口迁到 www.mixm.top 后本域降为双跑，2026-11-15
#       「retire cloud」提交把 DNS / vhost / 证书一并删除；2026-11-15 晚 DNS
#       恢复 A 115.159.159.11，本 vhost 与服务端证书 SAN 同步恢复，
#       否则严格校验会因证书不含该主机直接失败。
#
# 生产落位：/etc/nginx/sites-available/cloud.mixm.top.conf（软链到 sites-enabled）
# 证书：/etc/letsencrypt/live/mixmapp-domains/
#       SAN = api.mixm.top / cloud.mixm.top / img.mixm.top / mixm.top / www.mixm.top
#       由 certbot --nginx（http-01）续期，扩 SAN 用：
#       certbot certonly --nginx --cert-name mixmapp-domains -d mixm.top \
#         -d www.mixm.top -d api.mixm.top -d img.mixm.top -d cloud.mixm.top --expand
#
# 拓扑（与生产一致，非猜测）：
#   /                  → SPA 静态 root /opt/mixmapp/current/web（atomic-release 软链）
#   /mixmapp/api/v1/*  → 反代 127.0.0.1:8080，剥掉 /mixmapp 前缀
#   /api/v1/*          → 反代 127.0.0.1:8080，原样
#   /media/*           → alias /var/lib/mixmapp/storage/
#
# 约束：
#   1. 不写 default_server —— 同机 MixmAPP 的隐式默认 443 站点语义保持不变（与 Mim 共用 443）；
#   2. 80 段用 location 级跳转而非 server 级 return，否则 certbot 的 acme-challenge
#      exact-match location 会被 server 级 return 抢先执行，续期失败；
#   3. 本文件是蓝本，CI 不会自动渲染安装；改线上/改本文件需两边同步。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name cloud.mixm.top;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cloud.mixm.top;

    ssl_certificate     /etc/letsencrypt/live/mixmapp-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mixmapp-domains/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;

    # API 反代（不带 /mixmapp 前缀，探活与外部调用走这条）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # 前端同域 API 前缀（window.__MIXMAPP_API_BASE__=/mixmapp/api/v1，剥前缀转发）
    location /mixmapp/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # 本地存储图片直出：publicUrl(key)=/media/<key>，用 alias 避免 URL 前缀落进磁盘路径。
    # try_files 必须带 =404：alias + 带 URI 回退会拼错路径（docs/07 §18 踩过）。
    location /media/ {
        alias /var/lib/mixmapp/storage/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        # location 内出现 add_header 后 server 级安全头不再继承，这里补齐
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # H5 SPA（history 深链接回退）
    location / {
        root /opt/mixmapp/current/web;
        try_files $uri $uri/ /index.html;
    }
}
