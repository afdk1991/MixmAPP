# ============================================================================
# www.mixm.top —— 官网 / H5 正式站主入口（2026-11-14 定案）
# ----------------------------------------------------------------------------
# 职责：H5 静态站 + history 深链接回退。裸域 mixm.top 由 mixm.top.conf 301 到此。
# 证书：/etc/letsencrypt/live/mixmapp-domains/（SAN: mixm.top/www/api/img，certbot 自动续期）
# 回滚：异常时按 releases 回滚 H5 产物；cloud.mixm.top 为兼容入口（在用），可作短期兜底。
#
# ⚠ 过渡期兼容段（不是新架构的一部分，切换完成后可删）：
#   - location /mixmapp/、/api/：H5 产物的默认基址是相对路径 /mixmapp/api/v1。
#     在 GitHub Variables 把 MIXMAPP_API_BASE 改为 https://api.mixm.top/mixmapp/api/v1
#     之前，www 必须自己反代，否则页面上的接口全 404。
#   - location /media/：现有商品图 publicUrl = /media/products/<sha1>.jpg，
#     在图片地址切到 img.mixm.top 之前必须继续直出。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name www.mixm.top;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mixm.top;

    ssl_certificate     /etc/letsencrypt/live/mixmapp-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mixmapp-domains/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json text/plain text/css application/javascript application/xml image/svg+xml application/manifest+json;

    # ── 过渡期：同源 API 前缀（剥 /mixmapp 前缀）─────────────────────────
    location /mixmapp/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # ── 过渡期：原样路径（探活 / 外部直接调用）───────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # ── 过渡期：商品图直出（日后统一走 img.mixm.top）────────────────────
    # 图片名里带 sha1，内容寻址，可以一年 immutable；`-480` / `-960` 是服务端预生成的
    # 列表 / 详情缩略图，缺失时回退到同名原图，绝不出现破图。
    location ~ "^/media/products/(?<thumb_stem>[0-9a-f]+)-(?<thumb_size>480|960)\.(?<thumb_ext>jpe?g|png|webp)$" {
        alias /var/lib/mixmapp/storage/products/;
        try_files /$thumb_stem-$thumb_size.$thumb_ext /$thumb_stem.$thumb_ext =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /media/ {
        alias /var/lib/mixmapp/storage/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ── 构建产物：文件名带内容 hash，可长期缓存 ───────────────────────────
    location /assets/ {
        root /opt/mixmapp/current/web;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ── 静态图标：文件名不带 hash，给 7 天并允许过期重验证 ─────────────────
    location /static/ {
        root /opt/mixmapp/current/web;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ── HTML 壳：短缓存 + 必须重验证，保证发版后立刻拿到新资源引用 ─────────
    location = /index.html {
        root /opt/mixmapp/current/web;
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ── 预渲染快照：与 HTML 壳同一策略，避免用户停在旧商品页 ───────────────
    location ~ ^/(mall|pages)/ {
        root /opt/mixmapp/current/web;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ── Service Worker / manifest：不进长缓存，否则更新要等一天 ────────────
    location = /sw.js {
        root /opt/mixmapp/current/web;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /manifest.webmanifest {
        root /opt/mixmapp/current/web;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # ── SEO 文件：一小时缓存，改完不用等太久 ──────────────────────────────
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        root /opt/mixmapp/current/web;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # ── 旧入口 /b2b/ ────────────────────────────────────────────────────
    # H5 用 history 路由，产物里没有 /b2b 这个路径；命中 try_files 回退的
    # index.html 后路由解析不到页面，表现就是"整页空白、零请求"。
    # 这里直接把 /b2b、/b2b/、/b2b/xxx 302 到商城页。
    location ~ ^/b2b(/|$) {
        return 302 /pages/mall/index;
    }

    # ── H5 SPA（history 深链接回退）─────────────────────────────────────
    location / {
        root /opt/mixmapp/current/web;
        try_files $uri $uri/ /index.html;
    }
}
