# ============================================================================
# www.mixm.top —— 官网 / H5 正式站主入口（2026-11-14 定案）
# ----------------------------------------------------------------------------
# 职责：H5 静态站 + history 深链接回退。裸域 mixm.top 由 mixm.top.conf 301 到此。
# 证书：/etc/letsencrypt/live/mixmapp-domains/（SAN: mixm.top/www/api/img，certbot 自动续期）
# 回滚：cloud.mixm.top 已于 2026-11-15 退役，无回退域；异常时按 releases 回滚 H5 产物。
#
# ⚠ 过渡期兼容段（不是新架构的一部分，切换完成后可删）：
#   - location /mixmapp/、/api/：H5 产物的默认基址是相对路径 /mixmapp/api/v1。
#     在 GitHub Variables 把 MIXMAPP_API_BASE 改为 https://api.mixm.top/mixmapp/api/v1
#     之前，www 必须自己反代，否则页面上的接口全 404。
#   - location /media/：现有商品图 publicUrl = /media/products/<sha1>.jpg，
#     在图片地址切到 img.mixm.top 之前必须继续直出。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name www.mixm.top;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mixm.top;

    ssl_certificate     /etc/letsencrypt/live/mixmapp-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mixmapp-domains/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;

    # ── 过渡期：同源 API 前缀（剥 /mixmapp 前缀）─────────────────────────
    location /mixmapp/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # ── 过渡期：原样路径（探活 / 外部直接调用）───────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # ── 过渡期：商品图直出（日后统一走 img.mixm.top）────────────────────
    location /media/ {
        alias /var/lib/mixmapp/storage/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ── H5 SPA（history 深链接回退）─────────────────────────────────────
    location / {
        root /opt/mixmapp/current/web;
        try_files $uri $uri/ /index.html;
    }
}
