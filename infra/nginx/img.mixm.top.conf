# img.mixm.top —— 静态资源与图片独立域（xls 表内主机，2026-11-14 定案启用）
# 用途：承接原 cloud.mixm.top/media/ 直出的商品图与静态资源，便于单独做缓存策略与 CDN。
# 证书：/etc/letsencrypt/live/mixmapp-domains/（SAN: www/api/img）
# 回滚：删除本 server 块并 reload 即可；切换期业务侧仍可回退到 https://cloud.mixm.top/media/。
server {
    listen 80;
    listen [::]:80;
    server_name img.mixm.top;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name img.mixm.top;

    ssl_certificate     /etc/letsencrypt/live/mixmapp-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mixmapp-domains/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # 媒体文件内容寻址（文件名含 sha1），可长缓存；不设 CORS，<img> 标签不触发预检。
    location /media/ {
        alias /var/lib/mixmapp/storage/;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        return 404;
    }
}
