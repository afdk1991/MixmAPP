# img.mixm.top —— 静态资源与图片独立域（xls 表内主机，2026-11-14 定案启用）
# 用途：商品图与静态资源独立域（cloud.mixm.top/media/ 仍在线但仅为兼容入口，此处为主出口），便于单独做缓存策略与 CDN。
# 证书：/etc/letsencrypt/live/mixmapp-domains/（SAN: mixm.top/www/api/img）
# 回滚：删除本 server 块并 reload 即可；必要时回退到 cloud.mixm.top/media/（cloud 兼容入口在线）。
server {
    listen 80;
    listen [::]:80;
    server_name img.mixm.top;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name img.mixm.top;

    ssl_certificate     /etc/letsencrypt/live/mixmapp-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mixmapp-domains/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # 媒体文件内容寻址（文件名含 sha1），可长缓存。
    # 跨域：公开图片、无凭据，允许任意来源直接读字节（前端裁剪/导出用），不设 Allow-Credentials。
    # OPTIONS 预检直接 204，避免落到静态文件的 405。
    # 缩略图：列表用 -480、详情用 -960（服务端预生成）；缺失时回退同名原图，避免破图。
    location ~ "^/media/products/(?<thumb_stem>[0-9a-f]+)-(?<thumb_size>480|960)\.(?<thumb_ext>jpe?g|png|webp)$" {
        alias /var/lib/mixmapp/storage/products/;
        try_files /$thumb_stem-$thumb_size.$thumb_ext /$thumb_stem.$thumb_ext =404;
        access_log off;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /media/ {
        alias /var/lib/mixmapp/storage/;
        try_files $uri =404;
        access_log off;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location / {
        return 404;
    }
}
