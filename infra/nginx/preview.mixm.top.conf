# ============================================================================
# preview.mixm.top —— preview 通道（分通道发布槽位，2026-11-25 落地）
# ----------------------------------------------------------------------------
# 职责：preview 通道 H5 静态站 + history 深链接回退；API/媒体反代共享生产实例。
# 版本：前端产物构建期注入 V0.0.2-preview（version.json channel=preview → version:sync → build:h5）。
# 目录：/opt/mixmapp/channels/preview/web（独立于正式 current symlink，互不影响）。
# 证书：先以 80 直连；certbot 扩 SAN（--cert-name channels）后补 443 段与 301。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name preview.mixm.top;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name preview.mixm.top;

    ssl_certificate     /etc/letsencrypt/live/channels/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/channels/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;

    # API（剥 /mixmapp 前缀，共享生产 API 实例）
    location /mixmapp/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # 原样路径（探活 / 外部直接调用）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # 商品图直出（与生产同一 storage）
    location /media/ {
        alias /var/lib/mixmapp/storage/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
    }

    # H5 SPA（history 深链接回退）
    location / {
        root /opt/mixmapp/channels/preview/web;
        try_files $uri $uri/ /index.html;
    }
}
