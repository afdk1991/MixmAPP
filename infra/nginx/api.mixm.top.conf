# ============================================================================
# api.mixm.top —— 后端 API 与支付回调宿主（2026-11-14 定案，取代蓝图
# infra/nginx/mixmapp-api.conf）
# ----------------------------------------------------------------------------
# 职责：/mixmapp/api/v1/* 与 /api/v1/* 统一反代到 127.0.0.1:8080。
#   - /mixmapp/：剥前缀（客户端 api-base 为 https://api.mixm.top/mixmapp/api/v1）
#   - /api/    ：原样（探活、CloudBase 回源、外部直接调用）
# 本域不提供页面，location / 一律 404。
# 证书：/etc/letsencrypt/live/mixmapp-domains/（SAN: www/api/img）
#
# 双跑：在 api.mixm.top 的 healthz/meta 验证通过前，cloud.mixm.top 的
#   /mixmapp/ 必须保持在同一上游上，已发布 APK 与历史支付回调都指着它。
# 回滚：禁用本文件并 reload；apps/mobile/api-base.json 与支付回调保持 cloud。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.mixm.top;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mixm.top;

    ssl_certificate     /etc/letsencrypt/live/mixmapp-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mixmapp-domains/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;

    # ── 客户端统一基址：剥掉 /mixmapp 前缀 ───────────────────────────────
    #   /mixmapp/api/v1/healthz → 上游 /api/v1/healthz
    location /mixmapp/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # ── 原样路径：/api/v1/healthz、/api/v1/meta、支付 notify 等 ─────────
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # API 域不承载页面，避免误把 H5 挂到这里
    location / {
        return 404;
    }
}
